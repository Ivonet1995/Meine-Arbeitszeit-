<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Meine Arbeitszeit</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#111;background:#f2f2f7}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:auto;padding:22px 16px 40px}
h1{font-size:32px;margin:8px 0 4px}.sub{color:#6b6b73;margin-bottom:20px}
.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 1px 4px #00000012}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;color:#666;display:block;margin-bottom:5px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:17px;background:#fafafa}
button{width:100%;border:0;border-radius:13px;padding:14px;font-size:17px;font-weight:600;background:#007aff;color:#fff;margin-top:12px}
button.secondary{background:#e9e9ee;color:#111}.big{font-size:30px;font-weight:700}.muted{color:#777}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.row:last-child{border:0}
.danger{color:#d00;background:none;padding:4px;width:auto;margin:0;font-size:14px}
.total{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f7f7fa;border-radius:14px;padding:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>Meine Arbeitszeit</h1><div class="sub">Einfach Arbeitszeiten erfassen</div>

<div class="card">
  <div class="grid">
    <div><label>Datum</label><input id="date" type="date"></div>
    <div><label>Pause (Min.)</label><input id="break" type="number" min="0" value="30"></div>
  </div>
  <div class="grid" style="margin-top:10px">
    <div><label>Beginn</label><input id="start" type="time"></div>
    <div><label>Ende</label><input id="end" type="time"></div>
  </div>
  <button onclick="addEntry()">Arbeitszeit speichern</button>
</div>

<div class="card total">
 <div class="metric"><div class="muted">Heute</div><div class="big" id="today">0:00 h</div></div>
 <div class="metric"><div class="muted">Monat</div><div class="big" id="month">0:00 h</div></div>
</div>

<div class="card">
<h3 style="margin-top:0">Monatsübersicht</h3>
<div id="list"><div class="muted">Noch keine Einträge.</div></div>
<button class="secondary" onclick="clearAll()">Alle Daten löschen</button>
</div>
</div>

<script>
const KEY="arbeitszeit_v1";
const $=id=>document.getElementById(id);
let data=JSON.parse(localStorage.getItem(KEY)||"[]");
const pad=n=>String(n).padStart(2,"0");
function fmt(min){let sign=min<0?"-":"";min=Math.abs(Math.round(min));return sign+Math.floor(min/60)+":"+pad(min%60)+" h"}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function addEntry(){
 const date=$("date").value,start=$("start").value,end=$("end").value,br=Number($("break").value||0);
 if(!date||!start||!end){alert("Bitte Datum, Beginn und Ende eingeben.");return}
 let a=start.split(":").map(Number),b=end.split(":").map(Number);
 let s=a[0]*60+a[1],e=b[0]*60+b[1]; if(e<s)e+=1440;
 let mins=e-s-br;if(mins<0){alert("Die Arbeitszeit ist nach Abzug der Pause negativ.");return}
 data=data.filter(x=>x.date!==date); data.push({date,start,end,br,mins});data.sort((a,b)=>b.date.localeCompare(a.date));save();
}
function render(){
 const now=new Date(), ym=now.toISOString().slice(0,7), ds=now.toISOString().slice(0,10);
 const today=data.filter(x=>x.date===ds).reduce((a,x)=>a+x.mins,0);
 const month=data.filter(x=>x.date.startsWith(ym)).reduce((a,x)=>a+x.mins,0);
 $("today").textContent=fmt(today);$("month").textContent=fmt(month);
 $("list").innerHTML=data.length?data.map(x=>`<div class="row"><div><b>${new Date(x.date+"T12:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})}</b><br><span class="muted">${x.start} – ${x.end} · Pause ${x.br} Min.</span></div><div style="text-align:right"><b>${fmt(x.mins)}</b><br><button class="danger" onclick="removeEntry('${x.date}')">Löschen</button></div></div>`).join(""):"<div class='muted'>Noch keine Einträge.</div>";
}
function removeEntry(d){data=data.filter(x=>x.date!==d);save()}
function clearAll(){if(confirm("Wirklich alle gespeicherten Arbeitszeiten löschen?")){data=[];save()}}
$("date").value=new Date().toISOString().slice(0,10);
$("start").value="08:00";$("end").value="17:00";render();
</script>
</body></html>
